[General]
network = WclNetwork
sim-time-limit = 40s
seed-set = 123456
cmdenv-express-mode = true
**.scalar-recording = false
**.vector-recording = false
*.radioMedium.pathLoss.typename = "FreeSpacePathLoss"
*.radioMedium.pathLoss.alpha = 2
*.radioMedium.backgroundNoise.power = -100dBm
*.radioMedium.backgroundNoise.typename = "IsotropicScalarBackgroundNoise"
*.host[*].mobility.initFromDisplayString = false
*.host[*].mobility.initialZ = 0m
*.host[0].mobility.typename = "BonnMotionMobility"
*.host[0].mobility.traceFile = "anchor.movements"
*.host[0].mobility.nodeId = 0
*.host[0].mobility.is3D = false
*.host[1].mobility.initialX = 35m
*.host[1].mobility.initialY = 35m
*.host[2].mobility.initialX = 65m
*.host[2].mobility.initialY = 35m
*.host[3].mobility.initialX = 50m
*.host[3].mobility.initialY = 65m
*.host[*].radio.radioMediumModule = "^.^.radioMedium"
*.host[*].radio.antenna.mobilityModule = "^.^.mobility"
*.host[*].radio.initialRadioMode = "off"
*.host[*].radio.centerFrequency = 2.4GHz
*.host[*].radio.bandwidth = 2MHz
*.host[*].radio.transmitter.power = 1mW
*.host[*].radio.transmitter.bitrate = 250kbps
*.host[*].radio.transmitter.preambleDuration = 0s
*.host[*].radio.transmitter.headerLength = 64b
*.host[*].radio.receiver.sensitivity = -85dBm
*.host[*].radio.receiver.energyDetection = -90dBm
*.host[*].radio.receiver.snirThreshold = 4dB
